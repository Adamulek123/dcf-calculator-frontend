<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://www.gstatic.com https://apis.google.com;
                   style-src 'self' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' https://img.logo.dev data:;
                   connect-src 'self' http://localhost:5000 http://127.0.0.1:9099 https://dcf-backend.onrender.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com;
                   frame-src 'self' https://accounts.google.com https://dcf123-b6cb1.firebaseapp.com https://apis.google.com;
                   base-uri 'self';
                   object-src 'none';
                   form-action 'self';">
    <meta name="theme-color" content="#0b101a">
    <title>Register | DCF Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main id="main-content" class="login-shell">

        <section class="login-card login-card--auth" aria-label="Create account">

                <a href="login.html" class="login-back" aria-label="Back to login">
                    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 2L4 7l5 5"/>
                    </svg>
                    Back to login
                </a>

                <h1>Create your account</h1>
                <p>Register with your email to start using the DCF Calculator.</p>

                <form id="registerForm" class="stack auth-form" novalidate>
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" aria-invalid="false" aria-describedby="registerEmailError" required>
                    <span id="registerEmailError" class="field-error" role="alert" aria-live="polite" hidden></span>

                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" autocomplete="new-password" spellcheck="false" aria-invalid="false" aria-describedby="registerPasswordHint registerPasswordError" minlength="6" required>
                    <span id="registerPasswordHint" class="field-hint">Use at least 6 characters.</span>
                    <span id="registerPasswordError" class="field-error" role="alert" aria-live="polite" hidden></span>

                    <button type="submit" id="registerBtn" class="btn btn-solid auth-submit">Create account</button>
                </form>

                <p id="registerMessage" class="auth-message" role="status" aria-live="polite"></p>

        </section>

    </main>

    <script type="module" src="js/register-page.js"></script>
    <script src="js/service-worker-register.js" defer></script>
</body>
</html>
